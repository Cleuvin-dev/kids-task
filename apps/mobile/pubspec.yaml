name: mobile
description: "Kid's Task - aplicativo único para responsáveis e crianças"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  intl: ^0.20.2

  domain:
    path: ../../packages/domain
  data_access:
    path: ../../packages/data_access
  design_system:
    path: ../../packages/design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  shared_preferences: ^2.5.3

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../packages/design_system/branding/app_icon_master.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#2F80ED"
  image: "../../packages/design_system/branding/splash_master.png"
  android_12:
    color: "#2F80ED"
    image: "../../packages/design_system/branding/splash_master.png"
